name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Claude Code ${{ matrix.claude-code }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 確かめた版と、最新版。mod の API は early access なので、最新版で落ちたら API が変わった合図
        claude-code: ['2.1.294', 'latest']
    # 最新版での失敗は知らせるだけにして、PR は止めない
    continue-on-error: ${{ matrix.claude-code == 'latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude-code }}

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate, test and type-check each mod
        env:
          IS_LATEST: ${{ matrix.claude-code == 'latest' }}
        run: |
          status=0
          for manifest in */.claude-plugin/plugin.json; do
            mod="${manifest%%/*}"
            echo "::group::$mod"
            claude plugin validate "./$mod" || status=1
            claude plugin test "./$mod" || status=1
            # 型は、エンジンが mod を読み込んだときにだけ .claude-plugin/types/ に書かれる。
            # 2.1.294 では、ログインしていない claude -p も "Not logged in" で終わる前に読み込んで書く。
            # 2.1.295 はこの形では書かないので、最新版で型がなければ型検査だけ飛ばす（テストと validate は回す）
            echo hi | claude -p --plugin-dir "./$mod" --max-turns 1 > /dev/null 2>&1 || true
            if [ -f "./$mod/.claude-plugin/types/tsconfig.json" ]; then
              npx --yes --package=typescript@5 -- tsc -p "./$mod" || status=1
            elif [ "$IS_LATEST" = "true" ]; then
              echo "::warning::$mod: この版の Claude Code は型を書かなかったので、型検査を飛ばした"
            else
              echo "::error::$mod: Claude Code が .claude-plugin/types/ を書かなかった"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
